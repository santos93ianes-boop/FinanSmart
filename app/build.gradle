plugins {
    id 'com.android.application'
}

android {
    namespace 'com.finansmart.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.finansmart.app'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
